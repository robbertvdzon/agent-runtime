name: Repository verification
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: agent-runtime-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.6', channel: stable, cache: true}
      - run: flutter test
        working-directory: monitor-ui
      - run: bash monitor-ui/tool/build_and_sync.sh
      - run: git diff --exit-code -- agent-runtime-server/src/main/resources/static
      - run: mvn -B --no-transfer-progress verify
      - run: bash execution-images/test-run-agent.sh
      - run: |
          docker build --target build -t agent-runtime-build .
          docker build -t agent-runtime-server .
      - run: |
          kustomize build deploy/production >/dev/null
          kustomize build deploy/acceptance >/dev/null
