name: Repository verification
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: agent-runtime-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, actions: read, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Detect changed components since last successful verification
        id: changes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 .github/scripts/test-changed-components.py
          bash .github/scripts/changed-components.sh
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.java == 'true' || steps.changes.outputs.server == 'true'
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.ui == 'true'
        with: {flutter-version: '3.44.6', channel: stable, cache: true}
      - run: flutter test
        if: steps.changes.outputs.ui == 'true'
        working-directory: monitor-ui
      - run: bash monitor-ui/tool/build_and_sync.sh
        if: steps.changes.outputs.ui == 'true'
      - name: Verify reproducible embedded frontend
        if: steps.changes.outputs.ui == 'true'
        run: >-
          git diff --exit-code --
          agent-runtime-server/src/main/resources/static
          ':(exclude)agent-runtime-server/src/main/resources/static/canvaskit/**'
      - run: mvn -B --no-transfer-progress verify
        if: steps.changes.outputs.java == 'true' || steps.changes.outputs.server == 'true'
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.execution == 'true'
        with: {python-version: '3.12', cache: pip, cache-dependency-path: execution-images/requirements-test.txt}
      - run: python -m pip install -r execution-images/requirements-test.txt
        if: steps.changes.outputs.execution == 'true'
      - run: |
          python execution-images/test-mistral-agent.py
          python execution-images/test-ollama-agent.py
          bash execution-images/test-run-agent.sh
        if: steps.changes.outputs.execution == 'true'
      - run: bash deploy/macos/test-immutable-worker-jar.sh
        if: steps.changes.outputs.deploy == 'true' || steps.changes.outputs.java == 'true'
      - run: |
          kustomize build deploy/production >/dev/null
          kustomize build deploy/acceptance >/dev/null
        if: steps.changes.outputs.deploy == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.server == 'true'
      - name: Build the verified server image once
        if: steps.changes.outputs.server == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          load: true
          tags: agent-runtime-server:verified
          cache-from: type=gha,scope=runtime-server-amd64
          # PRs may read main's cache but cannot replace the release cache.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=runtime-server-amd64' || '' }}
      - name: Publish that exact image after all checks pass
        if: steps.changes.outputs.server == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/agent-runtime-server"
          docker tag agent-runtime-server:verified "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]; then
            docker tag agent-runtime-server:verified "$image:main"
            docker push "$image:main"
          fi
      - name: Timing summary
        if: always()
        run: echo 'Job and step timings are available in this run. Compare queue time separately from build time.' >> "$GITHUB_STEP_SUMMARY"
