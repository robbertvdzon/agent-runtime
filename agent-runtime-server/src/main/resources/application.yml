server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: agent-runtime-server
  datasource:
    url: ${AR_DB_URL:jdbc:h2:mem:agent_runtime;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${AR_DB_USERNAME:sa}
    password: ${AR_DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: agent-runtime
    version: "@project.version@"
agent-runtime:
  environment: ${AR_ENVIRONMENT:LOCAL}
  product-factory-token: ${AR_PRODUCT_FACTORY_TOKEN:local-product-factory-token}
  software-factory-token: ${AR_SOFTWARE_FACTORY_TOKEN:local-software-factory-token}
  hkh-autopilot-token: ${AR_HKH_AUTOPILOT_TOKEN:local-hkh-autopilot-token}
  hkh-token: ${AR_HKH_TOKEN:local-hkh-token}
  pvdd-token: ${AR_PVDD_TOKEN:local-pvdd-token}
  personal-news-feed-token: ${AR_PERSONAL_NEWS_FEED_TOKEN:local-personal-news-feed-token}
  additional-consumer-tokens: ${AR_ADDITIONAL_CONSUMER_TOKENS:}
  worker-token: ${AR_WORKER_TOKEN:local-worker-token}
  test-control-token: ${AR_TEST_CONTROL_TOKEN:}
  worker-api-enabled: ${AR_WORKER_API_ENABLED:true}
  admin-token: ${AR_ADMIN_TOKEN:local-admin-token}
  google-client-id: ${AR_GOOGLE_CLIENT_ID:}
  admin-emails: ${AR_ADMIN_EMAILS:}
  session-signing-secret: ${AR_SESSION_SIGNING_SECRET:local-session-signing-secret}
  lease-seconds: ${AR_LEASE_SECONDS:120}
  recovery-seconds: ${AR_RECOVERY_SECONDS:1800}
  max-attempts: ${AR_MAX_ATTEMPTS:3}
  default-priority: ${AR_DEFAULT_PRIORITY:50}
  max-output-attempts: ${AR_MAX_OUTPUT_ATTEMPTS:3}
  product-factory-environment-prefixes: ${AR_PRODUCT_FACTORY_ENVIRONMENT_PREFIXES:PF,HKH,HKH_AUTOPILOT,PERSONAL_FEED,ROBBERTS_ASSISTENT,SF}
  software-factory-environment-prefixes: ${AR_SOFTWARE_FACTORY_ENVIRONMENT_PREFIXES:SF,PF,HKH,HKH_AUTOPILOT,PERSONAL_FEED,ROBBERTS_ASSISTENT}
  hkh-autopilot-environment-prefixes: ${AR_HKH_AUTOPILOT_ENVIRONMENT_PREFIXES:HKH_AUTOPILOT}
  hkh-environment-prefixes: ${AR_HKH_ENVIRONMENT_PREFIXES:HKH}
  pvdd-environment-prefixes: ${AR_PVDD_ENVIRONMENT_PREFIXES:PVDD}
  product-factory-providers: ${AR_PRODUCT_FACTORY_PROVIDERS:CODEX,CLAUDE,MOCKED}
  software-factory-providers: ${AR_SOFTWARE_FACTORY_PROVIDERS:CODEX,CLAUDE,MOCKED}
  hkh-autopilot-providers: ${AR_HKH_AUTOPILOT_PROVIDERS:CODEX,CLAUDE,MOCKED}
  hkh-providers: ${AR_HKH_PROVIDERS:CODEX,CLAUDE,MOCKED}
  pvdd-providers: ${AR_PVDD_PROVIDERS:CODEX}
  product-factory-models: ${AR_PRODUCT_FACTORY_MODELS:*}
  software-factory-models: ${AR_SOFTWARE_FACTORY_MODELS:*}
  software-factory-repository-aliases: ${AR_SOFTWARE_FACTORY_REPOSITORY_ALIASES:software-factory,agent-runtime,test-repository,pvdd,hkh,hkh-autopilot,product-factory,personal-news-feed,robberts-assistent}
  hkh-autopilot-models: ${AR_HKH_AUTOPILOT_MODELS:*}
  hkh-models: ${AR_HKH_MODELS:*}
  pvdd-models: ${AR_PVDD_MODELS:gpt-5.6-sol}
  personal-news-feed-environment-prefixes: ${AR_PERSONAL_NEWS_FEED_ENVIRONMENT_PREFIXES:PERSONAL_FEED}
  personal-news-feed-providers: ${AR_PERSONAL_NEWS_FEED_PROVIDERS:CODEX,CLAUDE,MOCKED,LOCAL,ELEVENLABS}
  personal-news-feed-models: ${AR_PERSONAL_NEWS_FEED_MODELS:*}
  transcript-max-bytes-per-job: ${AR_TRANSCRIPT_MAX_BYTES_PER_JOB:10485760}
  object-store-path: ${AR_OBJECT_STORE_PATH:${java.io.tmpdir}/agent-runtime-objects}
  object-max-bytes: ${AR_OBJECT_MAX_BYTES:2147483648}
  job-input-max-bytes: ${AR_JOB_INPUT_MAX_BYTES:5368709120}
  job-output-max-bytes: ${AR_JOB_OUTPUT_MAX_BYTES:5368709120}
  object-store-min-free-bytes: ${AR_OBJECT_STORE_MIN_FREE_BYTES:0}
  upload-retention-hours: ${AR_UPLOAD_RETENTION_HOURS:24}
  failed-content-retention-days: ${AR_FAILED_CONTENT_RETENTION_DAYS:7}
  successful-content-retention-days: ${AR_SUCCESSFUL_CONTENT_RETENTION_DAYS:30}
  monitor-log-retention-days: ${AR_MONITOR_LOG_RETENTION_DAYS:14}
  v2-result-max-bytes: ${AR_V2_RESULT_MAX_BYTES:1048576}
  open-ai-api-key: ${AR_OPENAI_API_KEY:}
  open-ai-api-base-url: ${AR_OPENAI_API_BASE_URL:https://api.openai.com/v1}
  eleven-labs-api-key: ${AR_ELEVENLABS_API_KEY:}
  eleven-labs-base-url: ${AR_ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
  api-executor-concurrency: ${AR_API_EXECUTOR_CONCURRENCY:6}
  ffmpeg-binary: ${AR_FFMPEG_BINARY:ffmpeg}
