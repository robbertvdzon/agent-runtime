apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: postgres-local-path-scc}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:local-path-postgresql
subjects:
  - {kind: ServiceAccount, name: postgres}
