apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-runtime
resources:
  - ../base
  - namespace.yaml
  - sealed-secret.yaml
  - route.yaml
  - postgres-serviceaccount.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - backup-pvc.yaml
  - backup-cronjob.yaml
patches:
  - target: {kind: Deployment, name: agent-runtime-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - {name: AR_ENVIRONMENT, value: PRODUCTION}
