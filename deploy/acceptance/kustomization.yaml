apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-runtime-acceptance
resources:
  - ../base
  - namespace.yaml
  - sealed-secret.yaml
  - route.yaml
patches:
  - target: {kind: Deployment, name: agent-runtime-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - {name: AR_ENVIRONMENT, value: ACCEPTANCE}
          - {name: AR_WORKER_API_ENABLED, value: "false"}
          - {name: AR_PRODUCT_FACTORY_PROVIDERS, value: MOCKED}
          - {name: AR_SOFTWARE_FACTORY_PROVIDERS, value: MOCKED}
          - {name: AR_HKH_AUTOPILOT_PROVIDERS, value: MOCKED}
          - {name: AR_HKH_PROVIDERS, value: MOCKED}
          - {name: AR_DB_URL, value: "jdbc:h2:mem:agent_runtime_acceptance;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"}
          - {name: AR_DB_USERNAME, value: sa}
          - {name: AR_DB_PASSWORD, value: ""}
